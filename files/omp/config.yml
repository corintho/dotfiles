startup:
  quiet: true
  checkUpdate: true
task:
  eager: preferred
  enableLsp: true
symbolPreset: nerd
composer:
  shape: box
theme:
  dark: dark-gruvbox
setupVersion: 2
plan:
  defaultOnStartup: false
contextPromotion:
  enabled: true
hideThinkingBlock: true
power:
  sleepPrevention: "off"
defaultThinkingLevel: auto
share:
  serverUrl: http://127.0.0.1:0/s
collab:
  relayUrl: ws://127.0.0.1:0
tools:
  approvalMode: yolo
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: true
display:
  hideToolActivity: false
cycleOrder: []
statusLine:
  sessionAccent: false
  transparent: false
  compactThinkingLevel: true
  showHookStatus: true
  preset: custom
  contextLine: "off"
  leftSegments:
    - pi
    - time_spent
    - subagents
    - model
    - path
    - git
    - mode
    - cache_hit
    - context_pct
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    time:
      format: 24h
      showSeconds: false
computer:
  enabled: true
generate_image:
  enabled: true
checkpoint:
  enabled: false
dev:
  autoqa: false
  autoqaPush:
    endpoint: ""
compaction:
  methodOrder:
    - handoff
    - soft
    - shake
    - remote
    - snapcompact
  idleEnabled: false
browser:
  relay: true
