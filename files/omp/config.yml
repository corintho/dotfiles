startup:
  quiet: true
  checkUpdate: true
task:
  eager: preferred
symbolPreset: nerd
composer:
  shape: box
theme:
  dark: obsidian
setupVersion: 2
plan:
  defaultOnStartup: false
contextPromotion:
  enabled: true
hideThinkingBlock: true
power:
  sleepPrevention: system
defaultThinkingLevel: auto
share:
  serverUrl: http://127.0.0.1:0/s
collab:
  relayUrl: ws://127.0.0.1:0
tools:
  approvalMode: yolo
memory:
  backend: mnemopi
providers:
  memoryModel: online
autolearn:
  enabled: false
display:
  hideToolActivity: false
cycleOrder:
  - smol
  - slow
  - default
statusLine:
  sessionAccent: false
  transparent: false
  compactThinkingLevel: true
  showHookStatus: true
  preset: custom
  contextLine: "off"
  leftSegments:
    - pi
    - time_spent
    - subagents
    - model
    - path
    - git
    - mode
    - cache_hit
    - context_pct
    - token_rate
  rightSegments:
    - session_name
    - time
  segmentOptions:
    time:
      format: 24h
      showSeconds: false
