startup:
  quiet: true
  checkUpdate: true
task:
  eager: always
  enableLsp: true
symbolPreset: nerd
composer:
  shape: box
theme:
  dark: dark-gruvbox
setupVersion: 2
plan:
  defaultOnStartup: false
contextPromotion:
  enabled: true
hideThinkingBlock: true
power:
  sleepPrevention: "off"
defaultThinkingLevel: auto
share:
  serverUrl: http://127.0.0.1:0/s
collab:
  relayUrl: ws://127.0.0.1:0
tools:
  approvalMode: yolo
memory:
  backend: mnemopi
autolearn:
  enabled: true
  autoContinue: true
display:
  hideToolActivity: false
cycleOrder: []
statusLine:
  sessionAccent: false
  transparent: false
  compactThinkingLevel: true
  showHookStatus: true
  preset: custom
  contextLine: "off"
  leftSegments:
    - pi
    - time_spent
    - subagents
    - model
    - path
    - git
    - mode
    - cache_hit
    - context_pct
    - token_rate
  rightSegments:
    - session_name
  segmentOptions:
    time:
      format: 24h
      showSeconds: false
computer:
  enabled: true
generate_image:
  enabled: true
checkpoint:
  enabled: true
dev:
  autoqa: false
  autoqaPush:
    endpoint: https://localhost
compaction:
  methodOrder:
    - handoff
    - soft
    - shake
    - remote
    - snapcompact
  idleEnabled: false
browser:
  relay: true
vault:
  enabled: true
steeringMode: all
followUpMode: all
stream:
  serverUrl: https://127.0.0.1
autoResume: true
modelPresets:
  work:
    modelRoles:
      default: github-copilot/claude-sonnet-5.5
      tiny: github-copilot/claude-haiku-4.5:auto
      smol: github-copilot/claude-haiku-4.5:auto
    defaultThinkingLevel: auto
  free:
    modelRoles:
      default: freeflow/big-pickle
    defaultThinkingLevel: auto
  local:
    modelRoles:
      default: llama-swap/empero-ai/Qwen3.8-27B-Ridge-GGUF:Ridge-3.7bpw-q4max
    defaultThinkingLevel: auto